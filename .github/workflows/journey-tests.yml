name: Run Journey Tests on GitHub

permissions:
  id-token: write
  contents: write
  checks: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      test:
        description: 'Choose test suite'
        type: choice
        required: false
        default: ''
        options:
          - ''
          - 'api'
          - 'ui'
      tag:
        description: 'Choose test group'
        type: choice
        required: false
        default: ''
        options:
          - ''
          - 'smoke'
          - 'e2e'
      branch-set:
        description: 'Which branch to test (branch names must match across all repos)'
        type: string
        required: false
        default: main
      lis-dev-ref:
        description: 'Which lis-dev branch or commit to run the platform from'
        type: string
        required: false
        default: main

  workflow_call:
    inputs:
      test:
        required: false
        type: string
        default: ''
      tag:
        required: false
        type: string
        default: ''
      branch-set:
        required: false
        type: string
        default: ${{ github.ref_name }}
      lis-dev-ref:
        required: false
        type: string
        default: main
      image-version:
        description: 'Published lis-journey-tests image to run; builds from source when empty'
        required: false
        type: string
        default: ''

jobs:
  journey-tests:
    name: Run Journey Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout lis-dev
        uses: actions/checkout@v7
        with:
          repository: DEFRA/lis-dev
          ref: ${{ inputs.lis-dev-ref }}
          path: lis-dev
          ssh-key: ${{ secrets.LIS_DEV_DEPLOY_KEY }}
          persist-credentials: false

      - name: Checkout lis-journey-tests
        uses: actions/checkout@v7
        with:
          repository: DEFRA/lis-journey-tests
          ref: ${{ inputs.branch-set }}
          path: lis-journey-tests

      - name: Fix permissions for lis-dev and lis-journey-tests scripts
        shell: bash
        run: |
          chmod -R +x lis-dev/.scripts/*.sh
          chmod -R +x lis-journey-tests/**/*.sh

      - name: Install mkcert and dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qqy libnss3-tools mkcert

      # FIX: Set ROOT_DIR so Localstack init scripts mount correctly
      - name: Set ROOT_DIR for compose mounts
        shell: bash
        run: echo "ROOT_DIR=${{ github.workspace }}" >> $GITHUB_ENV

      - name: Start development platform (lis-dev) and wait for it to be ready
        working-directory: lis-journey-tests/bin
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.LIS_GITHUB_MONITOR_PAT }}
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
          ssh-add - <<< "${{ secrets.LIS_SSH_KEY }}"
          chmod +x platform.sh
          ./platform.sh up

      - name: Archive npm failure logs
        uses: actions/upload-artifact@v7
        if: failure() # Only runs if the step above fails
        with:
            name: npm-logs
            path: ~/.npm/_logs/

      - name: Wait for platform to stabilise
        shell: bash
        run: sleep 15

      - name: List running containers
        shell: bash
        run: docker ps -a

      - name: Debug back-office logs
        shell: bash
        run: docker logs lis-dev-lis-hubs-back-office-1 || true

      - name: Debug back-office health endpoint
        shell: bash
        run: curl -v https://back-office.lis.defra/health

      - name: Debug front-office logs
        shell: bash
        run: docker logs lis-dev-lis-hubs-front-office-1 || true

      - name: Debug front-office health endpoint
        shell: bash
        run: curl -v https://front-office.lis.defra/health

      - name: Configure AWS credentials
        if: inputs.image-version != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: eu-west-2
          role-to-assume: arn:aws:iam::094954420758:role/github-lis-journey-tests-build-role

      - name: Log in to Amazon ECR
        if: inputs.image-version != ''
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Pull the published journey-tests image
        if: inputs.image-version != ''
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/lis-journey-tests:${{ inputs.image-version }}
        run: |
          docker pull "$IMAGE"
          echo "JOURNEY_TESTS_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Ensure report directories exist
        shell: bash
        run: |
          mkdir -p lis-journey-tests/allure-report
          mkdir -p lis-journey-tests/playwright-report

      - name: Run journey-tests inside Docker
        working-directory: lis-journey-tests
        shell: bash
        env:
          TEST_INPUT: ${{ inputs.test }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          FILTER=""

          if [[ -n "$TEST_INPUT" ]]; then
          FILTER="$TEST_INPUT"
          fi

          if [[ -n "$TAG_INPUT" ]]; then
          if [[ -n "$FILTER" ]]; then
              FILTER="$FILTER|$TAG_INPUT"
          else
              FILTER="$TAG_INPUT"
          fi
          fi

          echo "Running tests with filter: $FILTER"

          # Run the published image when one was pulled, otherwise build it.
          BUILD=()
          if [[ -z "${JOURNEY_TESTS_IMAGE:-}" ]]; then
          BUILD=(--build)
          fi

          if [[ -z "$FILTER" ]]; then
          docker compose -p lis-dev -f compose.yml up "${BUILD[@]}" --abort-on-container-exit
          else
          docker compose -p lis-dev -f compose.yml run --rm "${BUILD[@]}" journey-tests \
              sh -c "npm ci && npx playwright test --grep='$FILTER'"
          fi

      - name: Debug Inspect lis-dev network
        if: always()
        shell: bash
        run: docker network inspect lis-dev_default || true

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: lis-journey-tests/allure-results
          if-no-files-found: ignore

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: lis-journey-tests/playwright-report/html
          if-no-files-found: ignore

      - name: Collect Docker logs
        if: always()
        shell: bash
        run: |
          echo "Docker container logs" > logs.txt
          echo "=====================" >> logs.txt
          docker ps -a >> logs.txt

          for c in $(docker ps -a --format "{{.Names}}"); do
          echo "=====================" >> logs.txt
          echo "CONTAINER: $c" >> logs.txt
          echo "=====================" >> logs.txt
          docker logs $c >> logs.txt 2>&1 || true
          done

      - name: Upload docker logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-logs
          path: logs.txt

      - name: Publish Test Report with Insights
        uses: ctrf-io/github-test-reporter@v1.1.0
        with:
          fail-rate-report: true
          flaky-rate-report: true
          github-report: true
          insights-report: true
          pull-request-report: true
          report-path: lis-journey-tests/playwright-report/*.json
          slowest-report: true
          summary-delta-report: true
          upload-artifact: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: always()

      # Stop platform (UI + backend)
      - name: Stop platform
        if: always()
        working-directory: lis-journey-tests/bin
        shell: bash
        run: ./platform.sh down

      # Slack reporting is covered by CDP notification integration and is setup for DEV, Test and Ext-Test environments
