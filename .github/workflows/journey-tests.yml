name: Run Journey Tests on GitHub

permissions:
  checks: write
  pull-requests: write

on:
  workflow_dispatch:
  workflow_call:
jobs:
  build:
    name: Run Journey Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: ./run-journey-tests/action.yml
        with:
            github-token: ${{ secrets.GITHUB_TOKEN }}
            secrets: inherit
