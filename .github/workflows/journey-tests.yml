name: Run Journey Tests on GitHub

permissions:
  id-token: write
  contents: write
  checks: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      test:
        description: 'Choose test suite'
        type: choice
        required: false
        default: ''
        options:
          - ''
          - 'api'
          - 'ui'
      tag:
        description: 'Choose test group'
        type: choice
        required: false
        default: ''
        options:
          - ''
          - 'smoke'
          - 'e2e'
      branch-set:
        description: 'Which branch to test (branch names must match across all repos)'
        type: string
        required: false
        default: main
      lis-dev-ref:
        description: 'Which lis-dev branch or commit to run the platform from'
        type: string
        required: false
        default: main

      lis-versions-overrides:
        description: 'Pin LIS images: comma-separated <project>:<version>, e.g. hubs-front-office:0.48.0'
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      test:
        required: false
        type: string
        default: ''
      tag:
        required: false
        type: string
        default: ''
      branch-set:
        required: false
        type: string
        default: ${{ github.ref_name }}
      lis-dev-ref:
        required: false
        type: string
        default: main
      image-version:
        description: 'Published lis-journey-tests image to run; builds from source when empty'
        required: false
        type: string
        default: ''
      lis-versions-overrides:
        description: 'Pin LIS images: comma-separated <project>:<version>'
        required: false
        type: string
        default: ''

jobs:
  journey-tests:
    name: Run Journey Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout lis-dev
        uses: actions/checkout@v7
        with:
          repository: DEFRA/lis-dev
          ref: ${{ inputs.lis-dev-ref }}
          path: lis-dev
          ssh-key: ${{ secrets.LIS_DEV_DEPLOY_KEY }}
          persist-credentials: false

      - name: Checkout lis-journey-tests
        uses: actions/checkout@v7
        with:
          repository: DEFRA/lis-journey-tests
          ref: ${{ inputs.branch-set }}
          path: lis-journey-tests

      # Pin every LIS image to its latest release (or the given overrides) so the
      # run is reproducible, and show the versions used in the job summary.
      - name: Pin the LIS image versions
        env:
          OVERRIDES: ${{ inputs.lis-versions-overrides }}
        run: |
          chmod +x lis-dev/.scripts/pin-image-versions.sh
          lis-dev/.scripts/pin-image-versions.sh --overrides="$OVERRIDES" lis-dev/.env | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fix permissions for lis-dev and lis-journey-tests scripts
        shell: bash
        run: |
          chmod -R +x lis-dev/.scripts/*.sh
          chmod -R +x lis-journey-tests/**/*.sh

      - name: Install mkcert and dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qqy libnss3-tools mkcert

      # FIX: Set ROOT_DIR so Localstack init scripts mount correctly
      - name: Set ROOT_DIR for compose mounts
        shell: bash
        run: echo "ROOT_DIR=${{ github.workspace }}" >> $GITHUB_ENV

      - name: Configure AWS credentials
        if: inputs.image-version != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: eu-west-2
          role-to-assume: arn:aws:iam::094954420758:role/github-lis-journey-tests-build-role

      - name: Log in to Amazon ECR
        if: inputs.image-version != ''
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Start pulling the published journey-tests image
        if: inputs.image-version != ''
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/lis-journey-tests:${{ inputs.image-version }}
        run: |
          # Runs while the platform starts; the later pull waits for it.
          nohup docker pull "$IMAGE" > image-pull.log 2>&1 &
          echo "JOURNEY_TESTS_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Start development platform (lis-dev) and wait for it to be ready
        working-directory: lis-journey-tests/bin
        shell: bash
        run: |
          chmod +x platform.sh
          ./platform.sh up

      - name: Archive npm failure logs
        uses: actions/upload-artifact@v7
        if: failure() # Only runs if the step above fails
        with:
            name: npm-logs
            path: ~/.npm/_logs/

      - name: Check the platform is serving
        shell: bash
        run: |
          for hub in back-office front-office; do
            curl -fsS --retry 5 --retry-all-errors --retry-delay 2 "https://$hub.lis.defra/health"
            echo
          done

      - name: Wait for the published journey-tests image
        if: inputs.image-version != ''
        run: |
          docker pull "$JOURNEY_TESTS_IMAGE"
          cat image-pull.log

      - name: Ensure report directories exist
        shell: bash
        run: |
          mkdir -p lis-journey-tests/allure-report
          mkdir -p lis-journey-tests/playwright-report

      - name: Run journey-tests inside Docker
        working-directory: lis-journey-tests
        shell: bash
        env:
          TEST_INPUT: ${{ inputs.test }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          FILTER=""

          if [[ -n "$TEST_INPUT" ]]; then
          FILTER="$TEST_INPUT"
          fi

          if [[ -n "$TAG_INPUT" ]]; then
          if [[ -n "$FILTER" ]]; then
              FILTER="$FILTER|$TAG_INPUT"
          else
              FILTER="$TAG_INPUT"
          fi
          fi

          echo "Running tests with filter: $FILTER"
          BUILD=()
          if [[ -z "${JOURNEY_TESTS_IMAGE:-}" ]]; then
          BUILD=(--build)
          fi
          PROFILE="$FILTER" docker compose -p lis-dev -f compose.yml up "${BUILD[@]}" --abort-on-container-exit --exit-code-from journey-tests
      - name: Debug Inspect lis-dev network
        if: always()
        shell: bash
        run: docker network inspect lis-dev_default || true

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: lis-journey-tests/allure-results
          if-no-files-found: ignore

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: lis-journey-tests/playwright-report/html
          if-no-files-found: ignore

      - name: Collect Docker logs
        if: always()
        shell: bash
        run: |
          echo "Docker container logs" > logs.txt
          echo "=====================" >> logs.txt
          docker ps -a >> logs.txt

          for c in $(docker ps -a --format "{{.Names}}"); do
          echo "=====================" >> logs.txt
          echo "CONTAINER: $c" >> logs.txt
          echo "=====================" >> logs.txt
          docker logs $c >> logs.txt 2>&1 || true
          done

      - name: Upload docker logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-logs
          path: logs.txt

      - name: Publish Test Report with Insights
        uses: ctrf-io/github-test-reporter@v1.1.0
        with:
          fail-rate-report: true
          flaky-rate-report: true
          github-report: true
          insights-report: true
          pull-request-report: true
          report-path: lis-journey-tests/playwright-report/*.json
          slowest-report: true
          summary-delta-report: true
          upload-artifact: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: always()
